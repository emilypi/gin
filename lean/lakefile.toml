name = "gin"
defaultTargets = ["Gin", "GinTest", "gin-check-export", "gin-export"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# The circuit DSL, the shipped examples and the exporter.
[[lean_lib]]
name = "Gin"
leanOptions = { linter.missingDocs = true }

# Tests: `#guard`, `#guard_msgs` and theorems checked by `lake build`.
[[lean_lib]]
name = "GinTest"

# Reject fixtures: designs the exporter must refuse. Not a default target, so
# they are built only on request (scripts/export-examples.sh --check-rejects).
# gin-export refuses a circuit that loads one unless it is marked a fixture.
[[lean_lib]]
name = "GinReject"

# Checks the modules, initializers, axioms and theorem shape of an export
# without linking or running any design; scripts/export-examples.sh runs it
# before gin-export.
[[lean_exe]]
name = "gin-check-export"
root = "GinCheckExport"

# Writes examples/<name>/<name>.gin.json and <name>.vectors.json; see
# scripts/export-examples.sh. `supportInterpreter` is required to import an
# environment with its extensions loaded.
[[lean_exe]]
name = "gin-export"
root = "GinExport"
supportInterpreter = true

# Reject fixture, not a default target: gin-export with a design whose
# module declares an `initialize` linked in (GinReject/Hooked.lean).
[[lean_exe]]
name = "gin-export-hooked"
root = "GinReject.HookedExport"
supportInterpreter = true

# Reject fixture, not a default target: gin-export followed by code that
# changes the trace it wrote (GinReject/ForgedExport.lean). The trace is
# `Certificate` in the code and "certificate" in the JSON.
[[lean_exe]]
name = "gin-export-forged"
root = "GinReject.ForgedExport"
supportInterpreter = true
