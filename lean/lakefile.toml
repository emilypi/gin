name = "gin"
defaultTargets = ["Gin", "GinTest", "gin-export"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# The circuit DSL, the shipped examples and the exporter. The reject
# fixtures `Gin.Examples.Bad` and `Gin.Examples.BadNative` belong to this
# library but no default target imports them, so they are built only on
# request (scripts/export-examples.sh --check-rejects).
[[lean_lib]]
name = "Gin"
leanOptions = { linter.missingDocs = true }

# Tests: `#guard`, `#guard_msgs` and theorems checked by `lake build`.
[[lean_lib]]
name = "GinTest"

# Writes examples/<name>/<name>.gin.json and <name>.vectors.json; see
# scripts/export-examples.sh. `supportInterpreter` is required to import an
# environment with its extensions loaded.
[[lean_exe]]
name = "gin-export"
root = "GinExport"
supportInterpreter = true
